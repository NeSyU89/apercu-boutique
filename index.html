  html, body { margin: 0; min-height: 100svh; background: #F7F1E7; color: #2E211A; font-family: Jost, "Helvetica Neue", Arial, sans-serif; }
  .acces { min-height: 100svh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .acces__boite { display: grid; gap: 20px; width: min(100%, 380px); justify-items: center; }
  .acces__logo { font-family: "Cormorant Garamond", Georgia, serif; font-size: 64px; line-height: 1; color: #C9AE74; }
  .acces__logo small { display: block; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #7A6034; margin-top: 6px; font-family: Jost, sans-serif; }
  .acces p { margin: 0; font-size: 14px; color: #6A574A; line-height: 1.5; }
  .acces input { width: 100%; box-sizing: border-box; min-height: 48px; padding: 8px 16px; border: 1px solid #8C7867; border-radius: 2px; background: #FBF8F2; font: inherit; font-size: 16px; text-align: center; letter-spacing: .06em; }
  .acces button { width: 100%; min-height: 48px; border: 1px solid #2E211A; border-radius: 2px; background: #2E211A; color: #F7F1E7; font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  .acces__erreur { color: #9B2F1F; }
  .acces__etat { color: #1F4E7A; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="acces">
  <form class="acces__boite" data-acces>
    <p class="acces__logo">Ivy<small>Jewels</small></p>
    <p>Aperçu privé de la boutique. Entrez le code d'accès reçu avec le lien.</p>
    <label for="cle" style="position:absolute;left:-9999px">Code d'accès</label>
    <input id="cle" name="cle" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="code d'accès">
    <button type="submit">Ouvrir la boutique</button>
    <p class="acces__erreur" data-erreur hidden>Code incorrect.</p>
    <p class="acces__etat" data-etat hidden>Ouverture…</p>
  </form>
</main>
<script>
(async () => {
  const form = document.querySelector("[data-acces]"), champ = document.getElementById("cle");
  const erreur = document.querySelector("[data-erreur]"), etat = document.querySelector("[data-etat]");
  const memo = { lis: () => { try { return sessionStorage.getItem("ivy.cle") || ""; } catch (e) { return ""; } }, ecrit: v => { try { sessionStorage.setItem("ivy.cle", v); } catch (e) {} } };
  let donnees = null;
  /* L'adresse porte l'empreinte du contenu : une nouvelle publication a une nouvelle adresse, donc le cache du
     navigateur ne peut plus resservir l'ancien site.bin (chiffré avec l'ancien code). « forcer » ignore en plus
     tout cache, pour la deuxième chance en cas d'échec. */
  const VERSION = "5897f3669bc2";
  const charge = async (forcer) => {
    if (donnees && !forcer) return donnees;
    const r = await fetch("site.bin?v=" + VERSION, { cache: forcer ? "reload" : "force-cache" });
    if (!r.ok) throw new Error("site.bin");
    donnees = new Uint8Array(await r.arrayBuffer());
    return donnees;
  };
  const dechiffre = async jeton => {
    const d = await charge();
    const magie = new TextDecoder().decode(d.slice(0, 4));
    if (magie !== "IVY2" && magie !== "IVY3") throw new Error("format");
    /* IVY3 étire un code court par PBKDF2 : le nombre de tours est écrit juste après la signature. */
    const tours = magie === "IVY3" ? new DataView(d.buffer, d.byteOffset + 4, 4).getUint32(0) : 0;
    const base = magie === "IVY3" ? 8 : 4;
    const sel = d.slice(base, base + 16), iv = d.slice(base + 16, base + 28), corps = d.slice(base + 28);
    const brut = new TextEncoder().encode(jeton);
    let cle;
    if (tours) {
      const ikm = await crypto.subtle.importKey("raw", brut, "PBKDF2", false, ["deriveKey"]);
      cle = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: sel, iterations: tours }, ikm, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    } else {
      const ikm = await crypto.subtle.importKey("raw", brut, "HKDF", false, ["deriveKey"]);
      cle = await crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: sel, info: new TextEncoder().encode("ivy-apercu") }, ikm, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }
    const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cle, corps);
    return new TextDecoder().decode(clair);
  };
  const ouvre = async (jeton, secondeChance) => {
    /* Le jeton est sensible à la casse (base64url) : on ne le normalise pas, on retire seulement les espaces. */
    jeton = (jeton || "").trim();
    if (!jeton) return;
    erreur.hidden = true; etat.hidden = false;
    try {
      const html = await dechiffre(jeton);
      memo.ecrit(jeton);
      /* La clé disparaît de l'adresse ; la boutique démarre sur son accueil. */
      const route = (location.hash.match(/#(\/[^&]*)/) || [])[1] || "/";
      history.replaceState(null, "", location.pathname + "#" + route);
      document.open(); document.write(html); document.close();
    } catch (e) {
      /* Deuxième chance : un binaire servi depuis un cache périmé donne exactement la même erreur qu'un
         mauvais code. On le retélécharge en ignorant tout cache avant de conclure. */
      if (!secondeChance) { donnees = null; try { await charge(true); } catch (_) {} return ouvre(jeton, true); }
      memo.ecrit("");
      etat.hidden = true; erreur.hidden = false; champ.focus(); champ.select();
    }
  };
  form.addEventListener("submit", e => { e.preventDefault(); ouvre(champ.value); });
  const jetonDeLAdresse = () => { const m = location.hash.match(/cle=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; };
  /* Un nouveau lien collé dans l'onglet déjà ouvert ne recharge pas la page (seul le fragment change) : on l'écoute. */
  addEventListener("hashchange", () => { if (jetonDeLAdresse()) ouvre(jetonDeLAdresse()); });
  if (jetonDeLAdresse()) ouvre(jetonDeLAdresse()); else if (memo.lis()) ouvre(memo.lis()); else champ.focus();
  charge().catch(() => {});
})();
</script>
</body>
